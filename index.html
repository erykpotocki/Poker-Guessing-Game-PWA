    <script>
      const canvas = document.querySelector('#unity-canvas');
      const loadingScreen = document.querySelector('#loading-screen');
      const loadingStatus = document.querySelector('#loading-status');
      const loadingTrack = document.querySelector('#loading-track');
      const loadingProgress = document.querySelector('#loading-progress');
      const updateNotice = document.querySelector('#update-notice');
      const updateTitle = document.querySelector('#update-title');
      const updateMessage = document.querySelector('#update-message');
      const updateClose = document.querySelector('#update-close');
      const releaseVersion = '1.3.20';
      let realProgress = 0, shownProgress = 0, runtimeReady = false, previousFrame = performance.now();
      function renderProgress(now) {
        const dt = Math.min(.1, (now - previousFrame) / 1000); previousFrame = now;
        const download = window.PokerDownloadProgress;
        const downloaded = download && download.total > 0 ? Math.min(1,download.loaded/download.total) : 0;
        const target = runtimeReady ? 100 : Math.min(95,Math.max(realProgress * 95,downloaded * 80));
        shownProgress = Math.min(target, shownProgress + Math.max(4, (target - shownProgress) * 3) * dt);
        const percent = Math.floor(shownProgress);
        if (!loadingScreen.classList.contains('ready')) {
          loadingProgress.style.width = percent + '%';
          loadingTrack.setAttribute('aria-valuenow', String(percent));
          const receiving = realProgress < .85 && downloaded < 1;
          loadingStatus.textContent = (receiving ? 'WCZYTYWANIE PLIKÓW… ' : runtimeReady ? 'PRZYGOTOWYWANIE MENU… ' : 'URUCHAMIANIE GRY… ') + percent + '%'
            + (receiving && download ? '\n' + Math.floor(download.loaded/1000000) + '\u00a0/\u00a0' + Math.ceil(download.total/1000000) + '\u00a0MB' : '');
          if (runtimeReady && shownProgress >= 100) finishLoading();
          else requestAnimationFrame(renderProgress);
        }
      }
      requestAnimationFrame(renderProgress);

      function finishLoading() {
        if (loadingScreen.classList.contains('hidden')) return;
        loadingProgress.style.width = '100%';
        loadingTrack.setAttribute('aria-valuenow', '100');
        loadingStatus.textContent = 'GOTOWE · 100%';
        window.PokerMobile?.finishBoot();
        loadingScreen.classList.add('hidden');
        window.setTimeout(() => { loadingScreen.style.display = 'none'; }, 400);
      }

      function showRestartNotice(title, message, version) {
        updateTitle.textContent = title;
        updateMessage.textContent = message;
        updateClose.textContent = version ? 'URUCHOM PONOWNIE' : 'SPRÓBUJ PONOWNIE';
        updateClose.onclick = () => {
          updateClose.disabled = true;
          if (version) {
            try { localStorage.setItem(window.PokerReleaseStorageKey || 'poker-zgadywany-last-release', version); } catch (_) {}
            window.location.replace('reset.html?v=' + Date.now());
          } else window.location.reload(); // Keep successfully downloaded parts.
        };
        updateNotice.classList.add('visible');
      }

      async function checkForNewVersion() {
        const controller = new AbortController();
        let timeout;
        try {
          // Update information is optional. A stalled request or response body
          // must not hold the game at its loading screen indefinitely.
          const release = await Promise.race([
            (async () => {
              const response = await fetch('release-notes.json', {
                cache: 'no-store', signal: controller.signal
              });
              return response.ok ? await response.json() : null;
            })(),
            new Promise(resolve => {
              timeout = setTimeout(() => {
                controller.abort();
                resolve(null);
              }, 3000);
            })
          ]);
          if (!release || typeof release.version !== 'string') return true;
          const storageKey = window.PokerReleaseStorageKey || 'poker-zgadywany-last-release';
          // Compare the files actually loaded, not the version remembered from
          // the last visit. A current build can start without a cache reset.
          if (releaseVersion !== release.version) {
            showRestartNotice(
              'Dostępna aktualizacja',
              'Aby wczytać nową wersję gry, uruchom aplikację ponownie.',
              release.version
            );
            return false;
          }
          localStorage.setItem(storageKey, release.version);
        } catch (_) {
          // Offline mode still works; update information is optional.
        } finally {
          clearTimeout(timeout);
        }
        return true;
      }

      const cacheReady = 'serviceWorker' in navigator ? (async () => {
        await navigator.serviceWorker.register(`service-worker.js?v=${releaseVersion}`);
        await navigator.serviceWorker.ready;
        if (!navigator.serviceWorker.controller) await new Promise(resolve => {
          const ready = () => { navigator.serviceWorker.removeEventListener('controllerchange', ready); resolve(); };
          navigator.serviceWorker.addEventListener('controllerchange', ready);
          if (navigator.serviceWorker.controller) ready();
          setTimeout(ready, 5000);
        });
      })().catch(() => {}) : Promise.resolve();

      const buildUrl = 'Build';
      const config = {
        // The service worker caches bounded files; avoid another archive copy in UnityCache.
        cacheControl: () => 'no-store',
        dataUrl: buildUrl + '/PWA.data?v=' + releaseVersion,
        frameworkUrl: buildUrl + '/PWA.framework.js?v=' + releaseVersion,
        codeUrl: buildUrl + '/PWA.wasm?v=' + releaseVersion,
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'DefaultCompany',
        productName: 'Poker zgadywany',
        productVersion: '1.3.20',
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };
      const script = document.createElement('script');
      script.src = buildUrl + '/PWA.loader.js?v=' + releaseVersion;
      script.onload = () => createUnityInstance(canvas, config, progress => {
        realProgress = Math.max(realProgress, progress);
      }).then(() => {
        runtimeReady = true;
      }).catch(() => {
          showRestartNotice(
            'Wymagane ponowne uruchomienie',
            'Nie udało się wczytać wszystkich plików gry. Zamknij i uruchom aplikację ponownie.'
          );
        });
      script.onerror = () => showRestartNotice(
        'Wymagane ponowne uruchomienie',
        'Nie udało się wczytać aktualnej wersji gry. Sprawdź połączenie i uruchom aplikację ponownie.'
      );

      Promise.all([checkForNewVersion(), Promise.race([cacheReady, new Promise(resolve => setTimeout(resolve, 8000))])]).then(([canStart]) => {
        if (canStart) document.body.appendChild(script);
      });
    </script>
